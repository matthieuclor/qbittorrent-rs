[package]
name = "qbittorrent-rs"
version = "0.1.0"
edition = "2024"
description = "A modern, asynchronous, and strongly typed Rust client for the qBittorrent WebUI API, designed for simplicity, performance, and ease of use."
repository = "https://github.com/matthieuclor/qbittorrent-rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "form", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
